<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCraft Playground</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
            background: #1d2830;
            color: #f8fafc;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        #overlay h1 {
            font-size: clamp(1.5rem, 2.5vw, 2.75rem);
            margin: 0;
            letter-spacing: 0.02em;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }
        #instructions {
            max-width: 520px;
            padding: 16px 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82), rgba(30, 64, 175, 0.65));
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }
        #instructions p {
            margin: 0 0 8px;
            line-height: 1.6;
        }
        #instructions p:last-child {
            margin-bottom: 0;
        }
        #lock-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #lock-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 40px rgba(56, 189, 248, 0.35);
        }
        #status {
            font-size: 0.95rem;
            opacity: 0.85;
        }
        canvas { display: block; }
        #hotbar {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.65);
            border-radius: 18px;
            backdrop-filter: blur(8px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.55);
        }
        .hotbar-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            background: rgba(71, 85, 105, 0.35);
            border: 2px solid transparent;
        }
        .hotbar-item.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.25);
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>MiniCraft Playground</h1>
        <div id="instructions">
            <p>WASD to move • Space to jump • Mouse to look</p>
            <p>Left click: add block · Right click: remove block</p>
            <p id="status">Click "Enter World" to start exploring.</p>
            <button id="lock-button">Enter World</button>
        </div>
    </div>
    <div id="hotbar">
        <div class="hotbar-item active" data-type="grass">🌿</div>
        <div class="hotbar-item" data-type="dirt">🪵</div>
        <div class="hotbar-item" data-type="stone">🪨</div>
        <div class="hotbar-item" data-type="glow">💡</div>
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
        import { PointerLockControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/PointerLockControls.js';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 4, 4);

        const controls = new PointerLockControls(camera, renderer.domElement);
        controls.getObject().position.set(0, 3, 6);
        scene.add(controls.getObject());

        const ambient = new THREE.HemisphereLight(0xbcd9ff, 0x2d4a1d, 0.75);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
        dirLight.position.set(50, 100, 25);
        scene.add(dirLight);

        const clock = new THREE.Clock();
        const move = { forward: false, backward: false, left: false, right: false, up: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let canJump = false;

        const hotbar = document.getElementById('hotbar');
        let activeMaterial = 'grass';
        hotbar.addEventListener('click', (event) => {
            const target = event.target.closest('.hotbar-item');
            if (!target) return;
            document.querySelectorAll('.hotbar-item').forEach(item => item.classList.remove('active'));
            target.classList.add('active');
            activeMaterial = target.dataset.type;
        });

        const materials = {
            grass: new THREE.MeshStandardMaterial({ color: 0x4caf50 }),
            dirt: new THREE.MeshStandardMaterial({ color: 0x8d5524 }),
            stone: new THREE.MeshStandardMaterial({ color: 0x9e9e9e }),
            glow: new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.6 })
        };

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);
        const blockIndex = new Map();

        function blockKey(x, y, z) {
            return `${x},${y},${z}`;
        }

        function addBlock(x, y, z, materialKey = 'grass') {
            const key = blockKey(x, y, z);
            if (blockIndex.has(key)) return;
            const mesh = new THREE.Mesh(blockGeometry, materials[materialKey]);
            mesh.position.set(x, y, z);
            mesh.castShadow = mesh.receiveShadow = true;
            worldGroup.add(mesh);
            blockIndex.set(key, { mesh, materialKey });
            return mesh;
        }

        function removeBlock(x, y, z) {
            const key = blockKey(x, y, z);
            const entry = blockIndex.get(key);
            if (!entry) return;
            worldGroup.remove(entry.mesh);
            blockIndex.delete(key);
        }

        function generateWorld(size = 18) {
            const half = Math.floor(size / 2);
            for (let x = -half; x <= half; x++) {
                for (let z = -half; z <= half; z++) {
                    const noise = (Math.sin(x * 0.45) + Math.cos(z * 0.4)) * 1.2;
                    const height = Math.floor(noise + 2);
                    for (let y = -3; y <= height; y++) {
                        const type = y === height ? 'grass' : y > height - 2 ? 'dirt' : 'stone';
                        addBlock(x, y, z, type);
                    }
                }
            }
        }

        generateWorld();

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        pointer.set(0, 0);

        function onMouseDown(event) {
            if (!controls.isLocked) return;
            event.preventDefault();
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(worldGroup.children, false);
            if (!intersects.length) return;

            const intersect = intersects[0];
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
            const normal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();
            const position = intersect.object.position.clone();

            if (event.button === 0) {
                const newPos = position.clone().add(normal).round();
                addBlock(newPos.x, newPos.y, newPos.z, activeMaterial);
            } else if (event.button === 2) {
                if (position.y > -3) {
                    removeBlock(position.x, position.y, position.z);
                }
            }
        }

        renderer.domElement.addEventListener('mousedown', onMouseDown);
        renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());

        const blocker = document.getElementById('instructions');
        const lockButton = document.getElementById('lock-button');
        const status = document.getElementById('status');

        lockButton.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
            status.textContent = 'Use ESC to pause and change settings.';
        });

        controls.addEventListener('unlock', () => {
            blocker.style.display = 'block';
            status.textContent = 'Click "Enter World" to return to the game.';
        });

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': move.forward = true; break;
                case 'ArrowLeft':
                case 'KeyA': move.left = true; break;
                case 'ArrowDown':
                case 'KeyS': move.backward = true; break;
                case 'ArrowRight':
                case 'KeyD': move.right = true; break;
                case 'Space':
                    if (canJump) velocity.y += 6.5;
                    canJump = false;
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': move.forward = false; break;
                case 'ArrowLeft':
                case 'KeyA': move.left = false; break;
                case 'ArrowDown':
                case 'KeyS': move.backward = false; break;
                case 'ArrowRight':
                case 'KeyD': move.right = false; break;
            }
        }

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 6.5 * delta;

                direction.z = Number(move.forward) - Number(move.backward);
                direction.x = Number(move.right) - Number(move.left);
                direction.normalize();

                if (move.forward || move.backward) velocity.z -= direction.z * 60.0 * delta;
                if (move.left || move.right) velocity.x -= direction.x * 60.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                controls.getObject().position.y += velocity.y * delta;

                if (controls.getObject().position.y < 2.5) {
                    velocity.y = 0;
                    controls.getObject().position.y = 2.5;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
